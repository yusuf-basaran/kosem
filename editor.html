<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yazı editörü · Köşem</title>
    <meta
      name="description"
      content="Köşem: Kendi blogunu oluştur, düşüncelerini paylaş, yeni hikâyeler keşfet."
    />
    <meta name="theme-color" content="#FAF7F2" />
    <script src="/js/preference.js"></script>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;450;500;550;600;650;700&family=Inter:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Literata:wght@400;500;600&family=Lora:wght@400;500;600;700&family=Merriweather:wght@400;700&family=Nunito+Sans:wght@400;600;700&family=Source+Serif+4:wght@400;500;600;700&family=Work+Sans:wght@400;500;600&subset=latin-ext&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/bilesenler.css" />
    <link rel="stylesheet" href="/css/tema.css" />
    <script src="/vendor/marked.min.js" defer></script>
    <script src="/vendor/purify.min.js" defer></script>
    <script type="module" src="/js/app.js"></script>
  </head>
  <body data-page="editor">
    <a class="skip-link" href="#main">İçeriğe geç</a>
    <header class="site-header">
      <div class="header-inner">
        <a class="brand" href="/" aria-label="Köşem ana sayfa"
          >Kö<span>ş</span>em</a
        >
        <nav aria-label="Ana menü">
          <a href="/" data-nav="home">Keşfet</a
          ><a href="/index.html?tab=blogs" data-nav="blogs">Bloglar</a>
        </nav>
        <button
          id="site-theme-toggle"
          class="theme-toggle"
          type="button"
          aria-pressed="false"
        >
          Koyu görünüm
        </button>
        <div class="header-actions" id="account-nav">
          <a href="/giris.html" class="login-link">Giriş yap</a
          ><a href="/kayit.html" class="button small"
            >Blog aç <span aria-hidden="true">↗</span></a
          >
        </div>
      </div>
    </header>
    <main id="main" class="page-container">
      <div class="editor-heading">
        <a class="back-link" href="/panel.html">← Yazılarıma dön</a>
        <div class="editor-actions">
          <button
            id="preview-toggle"
            class="button outline small"
            aria-pressed="false"
          >
            Önizleme</button
          ><button id="save-draft" class="button outline small">
            Taslağı kaydet</button
          ><button id="publish-post" class="button small">
            Yayınla <span aria-hidden="true">↗</span>
          </button>
        </div>
      </div>
      <p id="demo-note" class="notice" hidden>
        Önizleme editörü. Yazıp önizleyebilirsin; kaydetmek ve yayınlamak için
        Firebase bağlantısı gerekir.
      </p>
      <form id="editor-form" class="editor-form">
        <label class="sr-only" for="post-title">Yazının başlığı</label
        ><input
          id="post-title"
          class="title-input"
          required
          maxlength="160"
          placeholder="Anlatacakların bir başlıkla başlar…"
        />
        <div class="editor-meta">
          <div class="field">
            <label for="post-category">Kategori</label
            ><select id="post-category" required></select>
          </div>
          <div class="field cover-field">
            <label for="post-cover">Kapak görseli</label
            ><input
              id="post-cover"
              type="file"
              accept="image/jpeg,image/png,image/webp,image/gif,image/avif"
            /><small>En fazla 2 MB</small>
          </div>
        </div>
        <div id="editor-cover-wrap" hidden>
          <img
            id="editor-cover"
            class="editor-cover"
            alt="Yazı kapak önizlemesi"
          /><button id="remove-cover" class="text-button" type="button">
            Kapağı kaldır
          </button>
        </div>
        <div class="field">
          <label for="post-excerpt">Kısa açıklama</label
          ><textarea
            id="post-excerpt"
            rows="2"
            maxlength="300"
            placeholder="Yazının kapısını aralayan bir iki cümle."
          ></textarea>
        </div>
        <div class="markdown-toolbar">
          <span>MARKDOWN</span>
          <div>
            <button type="button" data-markdown="bold" aria-label="Kalın yazı">
              <b>B</b></button
            ><button
              type="button"
              data-markdown="italic"
              aria-label="İtalik yazı"
            >
              <i>İ</i></button
            ><button
              type="button"
              data-markdown="heading"
              aria-label="Alt başlık"
            >
              H2</button
            ><button
              type="button"
              data-markdown="link"
              aria-label="Bağlantı ekle"
            >
              Bağlantı</button
            ><button
              type="button"
              data-markdown="quote"
              aria-label="Alıntı ekle"
            >
              Alıntı
            </button>
          </div>
        </div>
        <label class="sr-only" for="post-content">Yazı içeriği</label
        ><textarea
          id="post-content"
          class="content-input"
          required
          maxlength="100000"
          placeholder="İlk cümleni yaz. Gerisi gelir…"
        ></textarea>
        <div id="editor-preview" class="prose editor-preview" hidden></div>
        <div class="editor-bottom">
          <span id="word-count">0 kelime · 1 dk okuma</span
          ><a
            href="https://www.markdownguide.org/basic-syntax/"
            target="_blank"
            rel="noopener noreferrer"
            >Markdown rehberi ↗</a
          >
        </div>
        <p id="save-status" role="status" class="muted"></p>
      </form>
    </main>
    <footer class="site-footer">
      <a class="brand" href="/">Kö<span>ş</span>em</a
      ><span>Herkesin bir köşesi var.</span
      ><span class="footer-note">Okumaya, yazmaya ve paylaşmaya alan.</span>
    </footer>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
